name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for marketplace trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vsce package -o craft-ls.vsix

      # Marketplace trusted publishing (OIDC) is not rolled out yet:
      # the token-exchange endpoint replies "Trusted Publishing is not supported".
      # Try OIDC first so it starts working the moment the feature ships;
      # fall back to a classic PAT stored in the VSCE_PAT repository secret.
      - name: Publish to VSCode Marketplace (OIDC, falls back to PAT)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if npx vsce publish --oidc --packagePath craft-ls.vsix; then
            echo "Published via OIDC trusted publishing."
          elif [ -n "$VSCE_PAT" ]; then
            echo "OIDC rejected by the Marketplace; publishing with PAT."
            npx vsce publish --packagePath craft-ls.vsix
          else
            echo "OIDC rejected and no VSCE_PAT secret configured." >&2
            exit 1
          fi

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" craft-ls.vsix --title "$tag" --generate-notes