name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vsce package -o craft-ls.vsix

      - name: Publish to VSCode Marketplace
        env:
          VSCE_PAT: ${{ secrets.MARKETPLACE_TOKEN }}
        run: npx vsce publish --packagePath craft-ls.vsix

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" craft-ls.vsix --title "$tag" --generate-notes
